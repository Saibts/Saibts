<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <style>
    .bg { fill: #111111; rx: 10px; }
    
    /* Minecraft Pixel Palette */
    .dirt { fill: #866043; }
    .grass-green { fill: #5c8e32; }
    .grass-dark { fill: #4c7828; }
    .wood-brown { fill: #96714b; }
    .iron-gray { fill: #d8d8d8; }
    .diamond-blue { fill: #4dedf4; filter: drop-shadow(0 0 4px #4dedf4); }
    .redstone-red { fill: #ff2200; filter: drop-shadow(0 0 5px #ff2200); }
    .redstone-dim { fill: #990000; }
    .stone { fill: #737373; }
    .coal { fill: #2c2c2c; }
    
    /* Animation for Redstone Pulse */
    .pulse {
      animation: redstone-glow 2s infinite alternate;
    }
    @keyframes redstone-glow {
      0% { opacity: 0.4; filter: drop-shadow(0 0 2px #ff2200); }
      100% { opacity: 1; filter: drop-shadow(0 0 8px #ff9900); }
    }
    
    .floating {
      animation: float 4s infinite ease-in-out;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
  </style>
  
  <rect width="100%" height="100%" class="bg" />
  
  <!-- LEFT: Pixelated Landscape Stack (Grass & Dirt blocks) -->
  <g transform="translate(40, 110)">
    <!-- Block 1 (Left) -->
    <rect x="0" y="30" width="60" height="60" class="dirt" />
    <rect x="0" y="30" width="60" height="15" class="grass-green" />
    <rect x="0" y="45" width="15" height="10" class="grass-dark" />
    <rect x="30" y="45" width="20" height="12" class="grass-dark" />
    
    <!-- Block 2 (Middle-Left stacked) -->
    <rect x="60" y="10" width="60" height="80" class="dirt" />
    <rect x="60" y="10" width="60" height="15" class="grass-green" />
    <rect x="70" y="25" width="15" height="10" class="grass-dark" />
    <rect x="100" y="25" width="20" height="8" class="grass-dark" />
    
    <!-- Block 3 (Right) -->
    <rect x="120" y="40" width="60" height="50" class="dirt" />
    <rect x="120" y="40" width="60" height="15" class="grass-green" />
    <rect x="135" y="55" width="15" height="8" class="grass-dark" />
  </g>
  
  <!-- CENTER: Floating Diamond Pickaxe / Software tool -->
  <g class="floating" transform="translate(380, 50) scale(1.6)">
    <!-- Handle (Wood) -->
    <rect x="0" y="36" width="4" height="4" class="wood-brown" />
    <rect x="4" y="32" width="4" height="4" class="wood-brown" />
    <rect x="8" y="28" width="4" height="4" class="wood-brown" />
    <rect x="12" y="24" width="4" height="4" class="wood-brown" />
    <rect x="16" y="20" width="4" height="4" class="wood-brown" />
    <rect x="20" y="16" width="4" height="4" class="wood-brown" />
    
    <!-- Iron/Stone Bindings -->
    <rect x="24" y="12" width="4" height="4" class="stone" />
    <rect x="20" y="12" width="4" height="4" class="stone" />
    <rect x="24" y="16" width="4" height="4" class="stone" />
    
    <!-- Diamond Pickaxe Head -->
    <rect x="28" y="8" width="4" height="4" class="diamond-blue" />
    <rect x="32" y="4" width="4" height="4" class="diamond-blue" />
    <rect x="36" y="0" width="4" height="4" class="diamond-blue" />
    <rect x="40" y="0" width="4" height="4" class="diamond-blue" />
    
    <rect x="24" y="8" width="4" height="4" class="diamond-blue" />
    <rect x="20" y="8" width="4" height="4" class="diamond-blue" />
    <rect x="16" y="12" width="4" height="4" class="diamond-blue" />
    <rect x="12" y="16" width="4" height="4" class="diamond-blue" />
  </g>
  
  <!-- RIGHT: Redstone Wiring System (Simulating Coding circuitry in Minecraft) -->
  <g transform="translate(560, 40)">
    <!-- Redstone Torch (Power Source) -->
    <!-- Handle -->
    <rect x="20" y="60" width="8" height="20" class="wood-brown" />
    <!-- Glowing Head -->
    <rect x="16" y="40" width="16" height="20" class="redstone-red pulse" />
    
    <!-- Redstone Dust Wire Traces -->
    <!-- Segment 1 -->
    <rect x="32" y="52" width="20" height="8" class="redstone-red pulse" />
    <rect x="52" y="52" width="8" height="30" class="redstone-red pulse" />
    <rect x="60" y="74" width="40" height="8" class="redstone-red pulse" />
    
    <!-- Splitters / Repeaters -->
    <rect x="100" y="68" width="24" height="20" class="stone" />
    <rect x="108" y="72" width="8" height="12" class="coal" />
    <rect x="104" y="76" width="4" height="4" class="redstone-dim" />
    <rect x="116" y="76" width="4" height="4" class="redstone-red pulse" />
    
    <!-- Output Segment -->
    <rect x="124" y="74" width="40" height="8" class="redstone-red pulse" />
    <circle cx="170" cy="78" r="5" fill="#ff2200" filter="drop-shadow(0 0 4px #ff2200)" />
  </g>
</svg>