<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Deep space dark radial gradient -->
    <radialGradient id="dark-space-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1635" />
      <stop offset="100%" stop-color="#0A0612" />
    </radialGradient>
  </defs>
  
  <!-- Dark circle background with glowing neon border -->
  <circle cx="100" cy="100" r="95" fill="url(#dark-space-grad)" stroke="#D946EF" stroke-width="2.5" />
  
  <!-- Head group tilted slightly for cute chibi look (Horns removed!) -->
  <g transform="rotate(-4, 100, 110)">
    
    <!-- YUNI LILAC HAIR: Full head of hair -->
    <!-- Back Hair Dome -->
    <circle cx="100" cy="106" r="50" fill="#DEC9F6" />
    
    <!-- Face base (extra chubby, soft skin tone) -->
    <ellipse cx="100" cy="118" rx="45" ry="35" fill="#FFF1F2" />
    
    <!-- Side hair framing the cheeks (cozy bob cut) -->
    <path d="M 54 100 Q 48 120 54 135 Q 67 122 66 110 Z" fill="#DEC9F6" />
    <path d="M 146 100 Q 152 120 146 135 Q 133 122 134 110 Z" fill="#DEC9F6" />
    
    <!-- Forehead Bangs (Cozy flat cut with two small V splits) -->
    <path d="M 54 96 
             Q 100 78 146 96 
             L 142 105
             Q 125 105 122 100
             L 118 105
             Q 102 105 100 100
             L 97 105
             Q 76 105 56 105 Z" fill="#DEC9F6" />

    <!-- Soft rosy blush cheeks -->
    <ellipse cx="68" cy="122" rx="9" ry="5" fill="#FDA4AF" opacity="0.6" />
    <ellipse cx="132" cy="122" rx="9" ry="5" fill="#FDA4AF" opacity="0.6" />
    
    <!-- Tiny cute off-center smile -->
    <path d="M 95 125 Q 98 128 102 125" stroke="#475569" stroke-width="2.2" fill="none" stroke-linecap="round" />

    <!-- Tilted Deal-With-It Glasses -->
    <g transform="translate(54, 94) scale(1.15)">
      <!-- Left lens -->
      <rect x="0" y="8" width="28" height="11" rx="1" fill="#1E1B4B" />
      <rect x="4" y="19" width="20" height="3" rx="1" fill="#1E1B4B" />
      <rect x="8" y="22" width="12" height="3" rx="1" fill="#1E1B4B" />
      <!-- White pixel highlights -->
      <rect x="4" y="11" width="3" height="3" fill="#FFFFFF" />
      <rect x="12" y="15" width="3" height="3" fill="#FFFFFF" />
      
      <!-- Bridge -->
      <rect x="28" y="11" width="12" height="3" fill="#1E1B4B" />
      
      <!-- Right lens -->
      <rect x="40" y="8" width="28" height="11" rx="1" fill="#1E1B4B" />
      <rect x="44" y="19" width="20" height="3" rx="1" fill="#1E1B4B" />
      <rect x="48" y="22" width="12" height="3" rx="1" fill="#1E1B4B" />
      <!-- White pixel highlights -->
      <rect x="44" y="11" width="3" height="3" fill="#FFFFFF" />
      <rect x="52" y="15" width="3" height="3" fill="#FFFFFF" />
      
      <!-- Handles -->
      <rect x="-8" y="8" width="8" height="3" fill="#1E1B4B" />
      <rect x="68" y="8" width="8" height="3" fill="#1E1B4B" />
    </g>
    
    <!-- White shirt/collar at the bottom -->
    <path d="M 68 153 C 68 175, 132 175, 132 153 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <path d="M 85 153 Q 100 162 115 153" stroke="#CBD5E1" stroke-width="1.5" fill="none" />
  </g>
</svg>