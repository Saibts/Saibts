<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <style>
    .bg { fill: #0D1117; rx: 10px; }
    .title { fill: #58A6FF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 600; }
    .subtitle { fill: #8B949E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; }
    
    /* Terminal UI Elements */
    .terminal-frame { fill: #161B22; stroke: #30363D; stroke-width: 1.5; rx: 8px; }
    .terminal-bar { fill: #21262D; stroke: #30363D; stroke-width: 1.5; rx: 8px; }
    .dot-red { fill: #FF7B72; }
    .dot-yellow { fill: #D29922; }
    .dot-green { fill: #3FB950; }
    
    /* Text styling */
    .font-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; }
    .text-gray { fill: #8B949E; }
    .text-blue { fill: #58A6FF; }
    .text-green { fill: #3FB950; }
    .text-cyan { fill: #39D353; }
    .text-white { fill: #C9D1D9; }
    .text-orange { fill: #F0883E; }
    
    /* Interactive Sidebar items */
    .file-item { cursor: pointer; }
    .file-bg { fill: transparent; transition: fill 0.2s; }
    .file-item:hover .file-bg { fill: #21262D; }
    .file-item:hover .text-white { fill: #58A6FF; font-weight: bold; }
    
    /* Hover-to-reveal Console Screens */
    .console-screen { opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; transform: translateY(4px); }
    .welcome-screen { opacity: 1; transition: opacity 0.25s ease; }
    
    /* Hover triggers linking files to screens */
    #file-orion:hover ~ #screen-orion,
    #file-sign:hover ~ #screen-sign,
    #file-cloning:hover ~ #screen-cloning,
    #file-scout:hover ~ #screen-scout { opacity: 1; transform: translateY(0); }
    
    /* Hide welcome screen when hovering any file item */
    .terminal-group:hover #screen-welcome { opacity: 0; }
  </style>
  
  <rect width="100%" height="100%" class="bg" />
  
  <!-- Header -->
  <text x="25" y="32" class="title">💻 Interactive Repository Explorer</text>
  <text x="25" y="50" class="subtitle">Hover over the source files in the sidebar to inspect project properties</text>
  
  <!-- Terminal Console Group -->
  <g class="terminal-group" transform="translate(25, 70)">
    <!-- Terminal Outer Frame -->
    <rect width="750" height="185" class="terminal-frame" />
    
    <!-- Title Bar -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 742 0 A 8 8 0 0 1 750 8 L 750 30 L 0 30 Z" class="terminal-bar" />
    <circle cx="15" cy="15" r="5" class="dot-red" />
    <circle cx="30" cy="15" r="5" class="dot-yellow" />
    <circle cx="45" cy="15" r="5" class="dot-green" />
    <text x="375" y="19" class="font-mono text-gray" text-anchor="middle">terminal - project_explorer.sh</text>
    
    <!-- Sidebar Divider -->
    <line x1="220" y1="30" x2="220" y2="185" stroke="#30363D" stroke-width="1.5" />
    
    <!-- SIDEBAR: File Tree (x=10 to 210) -->
    <!-- Folder header -->
    <g transform="translate(15, 42)">
      <text x="0" y="15" class="font-mono text-blue">📂 src/projects</text>
      
      <!-- 1. Orion Local AI -->
      <g id="file-orion" class="file-item" transform="translate(15, 26)">
        <rect x="-10" y="-2" width="195" height="20" rx="3" class="file-bg" />
        <text x="0" y="12" class="font-mono text-white">📄 orion_local_ai.py</text>
      </g>
      
      <!-- 2. Sign Language -->
      <g id="file-sign" class="file-item" transform="translate(15, 50)">
        <rect x="-10" y="-2" width="195" height="20" rx="3" class="file-bg" />
        <text x="0" y="12" class="font-mono text-white">📄 sign_language_cv.py</text>
      </g>
      
      <!-- 3. Behavioral Cloning -->
      <g id="file-cloning" class="file-item" transform="translate(15, 74)">
        <rect x="-10" y="-2" width="195" height="20" rx="3" class="file-bg" />
        <text x="0" y="12" class="font-mono text-white">📄 behavioral_cloning.py</text>
      </g>
      
      <!-- 4. Scout Mini Driver -->
      <g id="file-scout" class="file-item" transform="translate(15, 98)">
        <rect x="-10" y="-2" width="195" height="20" rx="3" class="file-bg" />
        <text x="0" y="12" class="font-mono text-white">📄 scout_mini_driver.cpp</text>
      </g>
    </g>
    
    <!-- CONSOLE SCREENS (x=240 to 730) -->
    
    <!-- Welcome Screen -->
    <g id="screen-welcome" class="console-screen welcome-screen" transform="translate(240, 42)">
      <text x="0" y="20" class="font-mono text-blue">$ ./explore_projects.sh</text>
      <text x="0" y="45" class="font-mono text-white">&gt; Welcome to Saibts's Project console.</text>
      <text x="0" y="65" class="font-mono text-white">&gt; Hover over any script file in the sidebar tree</text>
      <text x="0" y="85" class="font-mono text-white">  to inspect its integration features, stack,</text>
      <text x="0" y="105" class="font-mono text-white">  and runtime application details.</text>
      
      <text x="0" y="135" class="font-mono text-green">System status: Ready (Offline Explorer)</text>
    </g>
    
    <!-- Orion Local AI Screen -->
    <g id="screen-orion" class="console-screen" transform="translate(240, 42)">
      <text x="0" y="20" class="font-mono text-blue">$ python orion_local_ai.py --info</text>
      
      <text x="0" y="45" class="font-mono text-green">Project: </text>
      <text x="100" y="45" class="font-mono text-white">Orion Local AI Assistant</text>
      
      <text x="0" y="65" class="font-mono text-green">Description: </text>
      <text x="100" y="65" class="font-mono text-white">Asynchronous voice agent powered by Llama 3.2</text>
      <text x="100" y="81" class="font-mono text-white">running locally through Ollama.</text>
      
      <text x="0" y="105" class="font-mono text-green">Stack: </text>
      <text x="100" y="105" class="font-mono text-orange">FastAPI, WebSockets, Web Speech API, Ollama</text>
      
      <text x="0" y="130" class="font-mono text-cyan">Output: Initialized local websocket server on port 8000...</text>
    </g>
    
    <!-- Sign Language Screen -->
    <g id="screen-sign" class="console-screen" transform="translate(240, 42)">
      <text x="0" y="20" class="font-mono text-blue">$ python sign_language_cv.py --mode=predict</text>
      
      <text x="0" y="45" class="font-mono text-green">Project: </text>
      <text x="100" y="45" class="font-mono text-white">Sign Language CV Translator</text>
      
      <text x="0" y="65" class="font-mono text-green">Description: </text>
      <text x="100" y="65" class="font-mono text-white">Real-time hand-gesture classification and translation</text>
      <text x="100" y="81" class="font-mono text-white">for sign-language visualization.</text>
      
      <text x="0" y="105" class="font-mono text-green">Stack: </text>
      <text x="100" y="105" class="font-mono text-orange">OpenCV, MediaPipe, Scikit-learn (SVM/CNN)</text>
      
      <text x="0" y="130" class="font-mono text-cyan">Output: Webcam source loaded. Detecting 21 hand joints...</text>
    </g>
    
    <!-- Behavioral Cloning Screen -->
    <g id="screen-cloning" class="console-screen" transform="translate(240, 42)">
      <text x="0" y="20" class="font-mono text-blue">$ python behavioral_cloning.py --train</text>
      
      <text x="0" y="45" class="font-mono text-green">Project: </text>
      <text x="100" y="45" class="font-mono text-white">Autonomous Behavioral Cloning</text>
      
      <text x="0" y="65" class="font-mono text-green">Description: </text>
      <text x="100" y="65" class="font-mono text-white">Deep learning steering model training a vehicle to drive</text>
      <text x="100" y="81" class="font-mono text-white">autonomously in virtual simulator track environments.</text>
      
      <text x="0" y="105" class="font-mono text-green">Stack: </text>
      <text x="100" y="105" class="font-mono text-orange">TensorFlow, Keras, NumPy, Udacity Simulator</text>
      
      <text x="0" y="130" class="font-mono text-cyan">Output: CNN model loaded. Validation loss: 0.034...</text>
    </g>
    
    <!-- Scout Mini Screen -->
    <g id="screen-scout" class="console-screen" transform="translate(240, 42)">
      <text x="0" y="20" class="font-mono text-blue">$ cat scout_mini_driver.cpp | grep -i "control"</text>
      
      <text x="0" y="45" class="font-mono text-green">Project: </text>
      <text x="100" y="45" class="font-mono text-white">AgileX Scout Mini ROS 2 Driver</text>
      
      <text x="0" y="65" class="font-mono text-green">Description: </text>
      <text x="100" y="65" class="font-mono text-white">Control driver integration and feedback loops targeting the</text>
      <text x="100" y="81" class="font-mono text-white">AgileX Scout Mini mobile robot platform chassis.</text>
      
      <text x="0" y="105" class="font-mono text-green">Stack: </text>
      <text x="100" y="105" class="font-mono text-orange">C++, ROS 2 (Jazzy), CAN-bus protocol, Micro-ROS</text>
      
      <text x="0" y="130" class="font-mono text-cyan">Output: CAN frame transmission active. Speed: 0.0 m/s...</text>
    </g>
    
  </g>
</svg>