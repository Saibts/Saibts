<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Dark synthwave radial background -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25163a" />
      <stop offset="100%" stop-color="#0b0713" />
    </radialGradient>
    <!-- Vibrant purple/pink hair gradient -->
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#A21CAF" />
    </linearGradient>
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
  </defs>
  
  <!-- Outer glowing circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-grad)" stroke="#D946EF" stroke-width="2.5" />
  
  <!-- Cute chibi hoodie collar -->
  <path d="M 65 150 C 65 180, 135 180, 135 150 Z" fill="url(#hoodie-grad)" />
  <path d="M 80 152 Q 100 162 120 152" stroke="#A5B4FC" stroke-width="2.5" fill="none" />
  
  <!-- Chibi Head/Face Base -->
  <ellipse cx="100" cy="115" rx="52" ry="42" fill="#FFE4E6" />
  
  <!-- Blush Cheeks -->
  <ellipse cx="64" cy="120" rx="8" ry="4" fill="#F43F5E" opacity="0.3" />
  <ellipse cx="136" cy="120" rx="8" ry="4" fill="#F43F5E" opacity="0.3" />
  
  <!-- Smirk / Smile -->
  <path d="M 93 126 Q 98 131 104 126" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round" />
  
  <!-- Chibi Hair Back -->
  <path d="M 45 115 C 30 65, 170 65, 155 115 Z" fill="url(#hair-grad)" />

  <!-- Bangs / Front Hair -->
  <path d="M 46 95 
           C 52 60, 148 60, 154 95
           L 142 85
           Q 130 90, 122 75
           Q 112 90, 102 75
           Q 92 90, 82 75
           Q 72 90, 58 85 Z" fill="url(#hair-grad)" />
  
  <!-- Cute Chibi Cat Ears (Gamer headset style) -->
  <path d="M 50 68 L 35 45 L 60 56 Z" fill="#A21CAF" />
  <path d="M 50 68 L 42 52 L 56 59 Z" fill="#FFE4E6" opacity="0.6" />
  
  <path d="M 150 68 L 165 45 L 140 56 Z" fill="#A21CAF" />
  <path d="M 150 68 L 158 52 L 144 59 Z" fill="#FFE4E6" opacity="0.6" />
  
  <!-- Thug Life "Deal With It" Pixel Sunglasses -->
  <g transform="translate(54, 92) scale(1.15)">
    <!-- Left lens -->
    <rect x="0" y="8" width="28" height="12" fill="#000000" />
    <rect x="4" y="20" width="20" height="4" fill="#000000" />
    <rect x="8" y="24" width="12" height="4" fill="#000000" />
    <!-- Highlights -->
    <rect x="4" y="12" width="4" height="4" fill="#FFFFFF" />
    <rect x="12" y="16" width="4" height="4" fill="#FFFFFF" />
    
    <!-- Bridge -->
    <rect x="28" y="12" width="12" height="4" fill="#000000" />
    
    <!-- Right lens -->
    <rect x="40" y="8" width="28" height="12" fill="#000000" />
    <rect x="44" y="20" width="20" height="4" fill="#000000" />
    <rect x="48" y="24" width="12" height="4" fill="#000000" />
    <!-- Highlights -->
    <rect x="44" y="12" width="4" height="4" fill="#FFFFFF" />
    <rect x="52" y="16" width="4" height="4" fill="#FFFFFF" />
    
    <!-- Side handles -->
    <rect x="-8" y="8" width="8" height="4" fill="#000000" />
    <rect x="68" y="8" width="8" height="4" fill="#000000" />
  </g>
</svg>