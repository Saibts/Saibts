<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <style>
    .bg { fill: #0D1117; rx: 10px; }
    .link { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
    .link-robotics { stroke: #3B82F6; stroke-width: 2; filter: drop-shadow(0 0 2px #3B82F6); }
    .link-ai { stroke: #00E5FF; stroke-width: 2; filter: drop-shadow(0 0 2px #00E5FF); }
    .link-embedded { stroke: #10B981; stroke-width: 2; filter: drop-shadow(0 0 2px #10B981); }
    
    .title-text { font-family: "Segoe UI", -apple-system, sans-serif; font-weight: bold; fill: #FFFFFF; font-size: 10.5px; text-anchor: middle; }
    .sub-text { font-family: "Segoe UI", -apple-system, sans-serif; fill: #8B949E; font-size: 9.5px; text-anchor: middle; }
    
    .core-node { fill: #1E1B4B; stroke: #D946EF; stroke-width: 2.5; filter: drop-shadow(0 0 5px #D946EF); }
    .node-robotics { fill: #1E293B; stroke: #3B82F6; stroke-width: 1.5; }
    .node-ai { fill: #1E293B; stroke: #00E5FF; stroke-width: 1.5; }
    .node-embedded { fill: #1E293B; stroke: #10B981; stroke-width: 1.5; }
    
    g.node-group:hover rect {
      fill: #0F172A !important;
      stroke-width: 2 !important;
    }
  </style>
  
  <rect width="100%" height="100%" class="bg" />
  
  <!-- CONNECTION PATHS -->
  <path d="M 400 160 L 225 160 M 225 160 L 200 75 M 225 160 L 200 155 M 225 160 L 200 235" class="link link-robotics" />
  <path d="M 400 160 Q 400 80 500 80 M 500 80 L 565 50 M 500 80 L 565 100 M 500 80 L 565 150" class="link link-ai" />
  <path d="M 400 160 Q 400 240 500 240 M 500 240 L 565 200 M 500 240 L 565 250 M 500 240 L 565 290" class="link link-embedded" />
  
  <!-- CENTRAL CORE NODE -->
  <g class="node-group">
    <rect x="340" y="135" width="120" height="50" rx="25" class="core-node" />
    <text x="400" y="160" class="title-text" font-size="12px">⚡ TECH STACK</text>
    <text x="400" y="173" class="sub-text" fill="#E879F9">Developer Toolbox</text>
  </g>
  
  <!-- ROBOTICS BRANCH -->
  <g class="node-group">
    <rect x="225" y="140" width="100" height="40" rx="6" class="node-robotics" />
    <text x="275" y="158" class="title-text">🤖 ROBOTICS</text>
    <text x="275" y="171" class="sub-text" fill="#60A5FA">Control & Systems</text>
  </g>
  <g class="node-group">
    <rect x="65" y="60" width="135" height="30" rx="4" class="node-robotics" />
    <text x="132.5" y="76" class="title-text">ROS 2 (Jazzy/Humble)</text>
    <text x="132.5" y="85" class="sub-text">Middleware & Nav2</text>
  </g>
  <g class="node-group">
    <rect x="65" y="140" width="135" height="30" rx="4" class="node-robotics" />
    <text x="132.5" y="156" class="title-text">AgileX Scout Mini</text>
    <text x="132.5" y="165" class="sub-text">Mobile Platforms & Arms</text>
  </g>
  <g class="node-group">
    <rect x="65" y="220" width="135" height="30" rx="4" class="node-robotics" />
    <text x="132.5" y="236" class="title-text">Sensors integration</text>
    <text x="132.5" y="245" class="sub-text">LIDAR, IMUs, Encoders</text>
  </g>
  
  <!-- CV & AI BRANCH -->
  <g class="node-group">
    <rect x="450" y="60" width="100" height="40" rx="6" class="node-ai" />
    <text x="500" y="78" class="title-text">👁️ CV & AI</text>
    <text x="500" y="91" class="sub-text" fill="#22D3EE">Computer Vision</text>
  </g>
  <g class="node-group">
    <rect x="565" y="35" width="150" height="30" rx="4" class="node-ai" />
    <text x="640" y="51" class="title-text">OpenCV & MediaPipe</text>
    <text x="640" y="60" class="sub-text">Hand/Pose Tracking</text>
  </g>
  <g class="node-group">
    <rect x="565" y="85" width="150" height="30" rx="4" class="node-ai" />
    <text x="640" y="101" class="title-text">PyTorch & TensorFlow</text>
    <text x="640" y="110" class="sub-text">Deep Learning models</text>
  </g>
  <g class="node-group">
    <rect x="565" y="135" width="150" height="30" rx="4" class="node-ai" />
    <text x="640" y="151" class="title-text">AI Agents & Antigravity</text>
    <text x="640" y="160" class="sub-text">Google AGY & Vibe Coding</text>
  </g>
  
  <!-- EMBEDDED BRANCH -->
  <g class="node-group">
    <rect x="450" y="220" width="100" height="40" rx="6" class="node-embedded" />
    <text x="500" y="238" class="title-text">💻 EMBEDDED</text>
    <text x="500" y="251" class="sub-text" fill="#34D399">Firmware & Soft</text>
  </g>
  <g class="node-group">
    <rect x="565" y="185" width="150" height="30" rx="4" class="node-embedded" />
    <text x="640" y="201" class="title-text">Python & Embedded C</text>
    <text x="640" y="210" class="sub-text">Main programming languages</text>
  </g>
  <g class="node-group">
    <rect x="565" y="235" width="150" height="30" rx="4" class="node-embedded" />
    <text x="640" y="251" class="title-text">ESP32, STM32 & Jetson</text>
    <text x="640" y="260" class="sub-text">Single Board Computers</text>
  </g>
  <g class="node-group">
    <rect x="565" y="275" width="150" height="30" rx="4" class="node-embedded" />
    <text x="640" y="291" class="title-text">Micro-ROS & Git</text>
    <text x="640" y="300" class="sub-text">Linux (Ubuntu) & VS Code</text>
  </g>
</svg>
